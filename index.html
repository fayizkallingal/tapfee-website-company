<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TapFee — Smart Fee & Rent Collection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 540px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 44px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    h1 { font-size: 2.4rem; margin-bottom: 12px; letter-spacing: -0.5px; }
    p { color: #cbd5e1; font-size: 1.05rem; line-height: 1.6; margin-bottom: 28px; }
    .footer { font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Launching Soon</span>
    <h1>TapFee</h1>
    <p>Automated fee and rent collection made effortless. Our website is launching shortly.</p>
    <div class="footer">&copy; 2026 TapFee &bull; tapfee.in</div>
  </div>
</body>
</html>
