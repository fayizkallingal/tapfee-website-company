<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFF1F"/><stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5D4"/><stop offset="1" stop-color="#0B5D52"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6FF4D"/><stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="sphere" cx="32%" cy="28%" r="75%">
      <stop offset="0" stop-color="#E9FFD0"/>
      <stop offset=".25" stop-color="#7CFF1F"/>
      <stop offset=".7" stop-color="#0E9F6E"/>
      <stop offset="1" stop-color="#064E3B"/>
    </radialGradient>
    <radialGradient id="sphere2" cx="30%" cy="25%" r="80%">
      <stop offset="0" stop-color="#CFFFF8"/>
      <stop offset=".3" stop-color="#00E5D4"/>
      <stop offset=".75" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#042F2E"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#00241d" flood-opacity=".45"/>
    </filter>
  </defs>
  <ellipse cx="400" cy="720" rx="260" ry="26" fill="#00241d" opacity=".35" filter="url(#blur)"/>
  <!-- rounded rotated slab -->
  <g filter="url(#shadow)" transform="rotate(-14 280 300)">
    <rect x="130" y="170" width="300" height="300" rx="70" fill="url(#g1)"/>
    <rect x="130" y="170" width="300" height="300" rx="70" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
    <path d="M160 260 C 220 200, 340 190, 410 230" stroke="#fff" stroke-opacity=".5" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
  <!-- torus ring -->
  <g filter="url(#shadow)">
    <circle cx="540" cy="260" r="120" fill="none" stroke="url(#g2)" stroke-width="64"/>
    <circle cx="540" cy="260" r="120" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="10" stroke-dasharray="180 600" transform="rotate(-120 540 260)"/>
  </g>
  <!-- big sphere -->
  <circle cx="470" cy="540" r="150" fill="url(#sphere)" filter="url(#shadow)"/>
  <!-- small sphere -->
  <circle cx="190" cy="610" r="70" fill="url(#sphere2)" filter="url(#shadow)"/>
  <!-- pill -->
  <g filter="url(#shadow)" transform="rotate(24 640 560)">
    <rect x="560" y="520" width="180" height="76" rx="38" fill="url(#g3)"/>
    <rect x="574" y="530" width="100" height="14" rx="7" fill="#fff" opacity=".45"/>
  </g>
  <g fill="#fff" opacity=".7">
    <circle cx="90" cy="180" r="5"/><circle cx="700" cy="120" r="4"/><circle cx="720" cy="420" r="6"/><circle cx="60" cy="440" r="4"/>
  </g>
</svg>
