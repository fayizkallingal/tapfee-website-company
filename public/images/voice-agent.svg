<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062c24"/><stop offset="1" stop-color="#0b4a3f"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFF1F"/><stop offset="1" stop-color="#00E5D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00E5D4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00E5D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#00110d" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="900" height="700" rx="40" fill="url(#bg)"/>
  <circle cx="450" cy="330" r="300" fill="url(#glow)"/>
  <g fill="none" stroke="#2dd4bf" stroke-opacity=".25">
    <circle cx="450" cy="330" r="130"/><circle cx="450" cy="330" r="190"/><circle cx="450" cy="330" r="250"/>
  </g>
  <!-- central orb -->
  <circle cx="450" cy="330" r="95" fill="url(#orb)" filter="url(#sh)"/>
  <!-- waveform -->
  <g fill="#04302a" stroke="#04302a" stroke-width="10" stroke-linecap="round">
    <line x1="392" y1="320" x2="392" y2="340"/>
    <line x1="412" y1="300" x2="412" y2="360"/>
    <line x1="432" y1="278" x2="432" y2="382"/>
    <line x1="452" y1="296" x2="452" y2="364"/>
    <line x1="472" y1="270" x2="472" y2="390"/>
    <line x1="492" y1="304" x2="492" y2="356"/>
    <line x1="512" y1="322" x2="512" y2="338"/>
  </g>
  <!-- call card left -->
  <g filter="url(#sh)">
    <rect x="40" y="110" width="310" height="110" rx="22" fill="#ffffff" fill-opacity=".96"/>
    <circle cx="86" cy="165" r="26" fill="#DCFCE7"/>
    <path d="M76 170 q10 14 24 0" stroke="#15803D" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="126" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Calling Hari Babu</text>
    <text x="126" y="182" font-family="Arial, sans-serif" font-size="16" fill="#64748b">₹1,000 pending</text>
    <rect x="126" y="194" width="86" height="8" rx="4" fill="#BBF7D0"/>
  </g>
  <!-- outcome card right -->
  <g filter="url(#sh)">
    <rect x="560" y="90" width="310" height="110" rx="22" fill="#ffffff" fill-opacity=".96"/>
    <circle cx="606" cy="145" r="26" fill="#DCFCE7"/>
    <path d="M594 145 l9 9 l17 -19" stroke="#15803D" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="646" y="138" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Payment promised</text>
    <text x="646" y="165" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Pays by Friday</text>
  </g>
  <!-- transcript bubbles -->
  <g filter="url(#sh)" font-family="Arial, sans-serif">
    <rect x="60" y="470" width="470" height="82" rx="22" fill="#ffffff" fill-opacity=".96"/>
    <text x="86" y="504" font-size="17" font-weight="700" fill="#047857">AI Agent</text>
    <text x="86" y="532" font-size="17" fill="#334155">Hello! This is a reminder about your pending fee.</text>
    <rect x="400" y="580" width="440" height="82" rx="22" fill="#10B981"/>
    <text x="426" y="614" font-size="17" font-weight="700" fill="#ECFDF5">Customer</text>
    <text x="426" y="642" font-size="17" fill="#ffffff">Sure, I'll pay by Friday.</text>
  </g>
  <g fill="#fff" opacity=".6"><circle cx="840" cy="320" r="5"/><circle cx="70" cy="380" r="4"/><circle cx="780" cy="470" r="3"/></g>
</svg>
